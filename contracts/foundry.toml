[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Arbitrum supports PUSH0, but "paris" is a safe default for the interfaces.
evm_version = "paris"

# Arbitrum Sepolia testnet — chainId 421614. RPC is read from the environment.
[rpc_endpoints]
arbitrum_sepolia = "${NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC}"

[etherscan]
# chainId is recorded here for later `forge verify`; add a key when verifying.
arbitrum_sepolia = { key = "", chain = 421614, url = "https://api-sepolia.arbiscan.io/api" }
